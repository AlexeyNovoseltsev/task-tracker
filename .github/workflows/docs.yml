# GitHub Actions workflow for documentation generation and deployment
# Note: Actions versions are correct, IDE linting errors are due to network/API access issues
name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
      - 'task-flow-api/src/**'
  workflow_dispatch:

jobs:
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      
      - name: Install backend dependencies
        working-directory: task-flow-api
        run: npm ci
      
      - name: Generate API documentation
        working-directory: task-flow-api
        run: |
          npx swagger-jsdoc -d swagger.config.js -o docs/api-spec.json src/**/*.ts || echo "API docs generation skipped"
          
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Build documentation site
        run: |
          mkdir -p docs-site
          cp -r task-flow-pro/AUTH_SYSTEM_README.md docs-site/
          cp -r task-flow-pro/SECURITY_AUDIT.md docs-site/
          cp -r task-flow-pro/DOCUMENTATION.md docs-site/
          cp -r task-flow-pro/ARCHITECTURE.md docs-site/
          cp -r task-flow-pro/README.md docs-site/
          echo "# TaskFlow Pro Documentation" > docs-site/index.md
          echo "- [Authentication System](AUTH_SYSTEM_README.md)" >> docs-site/index.md
          echo "- [Security Audit](SECURITY_AUDIT.md)" >> docs-site/index.md
          echo "- [Architecture](ARCHITECTURE.md)" >> docs-site/index.md
          echo "- [General Documentation](DOCUMENTATION.md)" >> docs-site/index.md
          echo "- [README](README.md)" >> docs-site/index.md
      
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs-site
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
