name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    name: Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install frontend deps
        working-directory: task-flow-pro
        run: npm ci || npm i --prefer-offline
      - name: Install backend deps
        working-directory: task-flow-api
        run: npm ci || npm i --prefer-offline
      - name: Lint frontend
        working-directory: task-flow-pro
        run: npm run lint --silent
      - name: Type-check frontend
        working-directory: task-flow-pro
        run: npm run type-check --silent

  tests:
    name: Tests (Unit + E2E)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install frontend deps
        working-directory: task-flow-pro
        run: npm ci || npm i --prefer-offline
      - name: Playwright browsers
        working-directory: task-flow-pro
        run: npx playwright install --with-deps
      - name: Run tests
        working-directory: task-flow-pro
        run: npm run test
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            task-flow-pro/playwright-report
            task-flow-pro/test-results

  build:
    name: Build (FE & BE)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install and build frontend
        working-directory: task-flow-pro
        run: |
          npm ci || npm i --prefer-offline
          npm run build
      - name: Install and build backend
        working-directory: task-flow-api
        run: |
          npm ci || npm i --prefer-offline
          npm run build